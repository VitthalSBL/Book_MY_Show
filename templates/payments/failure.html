{% extends 'base.html' %}
{% block title %}Payment Failed{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:520px">
    <div class="card shadow border-danger">
        <div class="card-body p-5">
            <i class="bi bi-x-circle-fill text-danger" style="font-size:4rem"></i>
            <h3 class="mt-3">Payment Failed</h3>
            <p>{{ payment.failure_reason|default:"Something went wrong." }}</p>
            <a href="{% url 'payments:create' payment.booking.booking_id %}" class="btn btn-bms">Retry Payment</a>
        </div>
    </div>
</div>
{% endblock %}

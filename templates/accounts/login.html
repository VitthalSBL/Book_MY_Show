{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5">
                    <h4 class="fw-bold text-center mb-1">Welcome back</h4>
                    <p class="text-muted text-center small mb-4">Login to book your tickets</p>
                    <form method="post">{% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" style="font-size:.95rem" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" style="font-size:.95rem" required>
                        </div>
                        <button class="btn btn-bms w-100 py-2">Login</button>
                    </form>
                    <p class="mt-4 mb-0 text-center small">No account? <a href="{% url 'accounts:register' %}" class="fw-semibold text-danger">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

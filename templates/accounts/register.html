{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5">
                    <h4 class="fw-bold text-center mb-1">Create account</h4>
                    <p class="text-muted text-center small mb-4">Join and start booking</p>
                    <form method="post">{% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password1" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" name="password2" class="form-control" required>
                        </div>
                        {% if form.errors %}<div class="alert alert-danger small">{{ form.errors }}</div>{% endif %}
                        <button class="btn btn-bms w-100 py-2">Sign Up</button>
                    </form>
                    <p class="mt-4 mb-0 text-center small">Have an account? <a href="{% url 'accounts:login' %}" class="fw-semibold text-danger">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

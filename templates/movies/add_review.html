{% extends 'base.html' %}
{% block title %}Review {{ movie.title }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:560px">
    <h4>{% if review %}Edit{% else %}Write{% endif %} Review - {{ movie.title }}</h4>
    {% if has_booked %}<p class="text-success small"><i class="bi bi-patch-check-fill"></i> Verified Viewer — you have booked this movie.</p>{% endif %}
    <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label">Rating</label>
            <select name="rating" class="form-select" required>
                {% for i in "54321" %}<option value="{{ i }}" {% if review.rating == i|add:0 %}selected{% endif %}>{{ i }} Stars</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Title (optional)</label><input name="title" class="form-control" value="{{ review.title|default:'' }}"></div>
        <div class="mb-3"><label class="form-label">Review</label><textarea name="content" class="form-control" rows="4" required>{{ review.content|default:'' }}</textarea></div>
        <button class="btn btn-bms">Submit</button>
    </form>
</div>
{% endblock %}
